[project]
name = "alphagrad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "jax",
    "jaxlib",
    "equinox",
    "optax",
    "distrax",
    "wandb",
    "tqdm",
    "more-itertools",
    "graphax",
    "immutables",
    "grain",
    "importlib_resources",
    "psutil",
]


#[tool.uv.sources]
#alphagrad = { path = ".", editable = true }
#alphagrad = { workspace = true }
#graphax = { workspace = true }

[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# For smarter version schemes and other configuration options,
# check out https://github.com/pypa/setuptools_scm
version_scheme = "no-guess-dev"

[tool.uv.extra-build-dependencies]
flash-attn = ["psutil"]

[tool.pytest.ini_options]
# There are TWO test roots. `src/alphagrad/approx/tests/` is easy to miss: it
# sits inside the package, so a bare `pytest` from the repo root never reached
# it, and three modules there rotted unnoticed (test_agent, test_loss and
# test_simple_head, all quarantined 2026-08-31) while a fourth,
# test_no_approx_head, raised SystemExit at import.
# Naming both roots is what makes the suite a gate rather than a sample.
testpaths = ["tests", "src/alphagrad/approx/tests"]
# Naming both roots also DELIBERATELY drops three stray files a bare
# `pytest` used to try to import from src/: ppo/reshape_test.py and
# ppo/implicit_reshape_test.py (module-level asserts, no test functions,
# no __main__ guard -- they ran their whole body at collection) and
# approx/test_transformer_approx.py (a __main__ script). None is a
# regression test; run them directly if wanted.
# Both naming styles are in use (test_*.py under tests/, *_test.py elsewhere).
python_files = ["test_*.py", "*_test.py"]
# THE SUITE COMMAND IS `pytest`, NOT `pytest tests/` (owner ruling 2026-09-12).
# `pytest tests/` collects 1371 and `pytest` 1460 -- the 89 in the second root
# had never been inside any number this campaign quoted, including the "14
# pre-existing failures" baseline. Measured 2026-09-12: all 89 pass on both
# sides of that diff in 48 s, so naming the roots you already declared costs
# 48 seconds. `docs/VALIDATION_GATES.md` section 1 is where this is written
# down for the next person, together with EXHAUSTIVE=1.
# -ra prints the reason for every skip. The quarantine convention (62062c58)
# records why a module cannot run in the skip message itself, so without -ra
# that record never reaches the person running the suite.
addopts = "-ra"
# Default `prepend` import mode is REQUIRED, not incidental:
# tests/core/... helpers are imported bare (`from utils import ...`), which
# only resolves because pytest puts each test file's directory on sys.path.
